name: Deploy Firebase Hosting

on:
  push:
    branches: [main]

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # config.js est gitignoré : on le génère à partir du secret RAWG_API_KEY.
      - name: Générer config.js
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          if [ -z "$RAWG_API_KEY" ]; then
            echo "::error::Secret RAWG_API_KEY manquant"
            exit 1
          fi
          printf 'const RAWG_API_KEY = "%s";\n' "$RAWG_API_KEY" > config.js

      - name: Déployer en production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: video-game-masters
          channelId: live
